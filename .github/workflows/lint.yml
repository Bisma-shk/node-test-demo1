
name: Node.js Lint

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Run ESLint
        run: npx eslint . -o lint-report.txt || true

      - name: Show report
        run: cat lint-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt
